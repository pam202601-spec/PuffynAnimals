<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:'Arial Rounded MT Bold','Arial',sans-serif;background:#000;}
.screen{position:fixed;inset:0;z-index:800;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;}
.screen.on{display:flex;}

/* SPLASH */
#scr-splash{background:radial-gradient(ellipse at 50% 30%,#1a0040,#000);}
.sp-logo .l1{font-size:3rem;font-weight:900;color:#FFD700;text-shadow:3px 3px 0 #333;display:block;text-align:center;}
.sp-logo .l2{font-size:.85rem;letter-spacing:5px;color:#FF88FF;display:block;margin-top:2px;font-weight:900;text-align:center;}
.sp-animals{display:flex;gap:8px;margin:14px 0;}
.sp-tile{width:65px;height:65px;border-radius:15px;background:#111;border:3px solid #FFD700;box-shadow:0 4px 0 #7A4000;overflow:hidden;}
.sp-tile img{width:100%;height:100%;object-fit:cover;}
.sp-btn-row{display:flex;flex-direction:column;gap:9px;width:260px;}
.sp-btn{width:100%;padding:13px;border-radius:22px;font-size:.95rem;font-weight:900;cursor:pointer;border:3px solid rgba(255,255,255,.3);letter-spacing:1px;}
.sp-btn.gold{background:linear-gradient(180deg,#FFE44D,#FF9900);color:#111;box-shadow:0 5px 0 #7A4000;}
.sp-btn.art{background:linear-gradient(180deg,#FF6600,#CC3300);color:#fff;box-shadow:0 5px 0 #881100;}
.sp-btn.purple{background:linear-gradient(180deg,#9933DD,#550088);color:#fff;box-shadow:0 5px 0 #330055;}
.sp-btn.green{background:linear-gradient(180deg,#33BB55,#006622);color:#fff;box-shadow:0 5px 0 #004411;}
.sp-btn.blue{background:linear-gradient(180deg,#3388FF,#002299);color:#fff;box-shadow:0 5px 0 #001166;}
.sp-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)!important;}

/* GAME */
#scr-game{background:#000;flex-direction:column;padding:0;}
#topbar{background:#000;border-bottom:3px solid #FFD700;padding:4px 8px;display:flex;align-items:center;gap:5px;flex-shrink:0;height:54px;width:100%;}
.tl1{font-size:1.2rem;font-weight:900;color:#FFD700;}
.tl2{font-size:.38rem;letter-spacing:2px;color:#FF88FF;font-weight:900;}
#mv-box{margin-left:auto;flex-shrink:0;background:#111;border:2.5px solid #FFD700;border-radius:12px;padding:2px 14px;text-align:center;}
.mv-lbl{font-size:.4rem;color:#FFD700;font-weight:900;text-transform:uppercase;}
.mv-val{font-size:1.9rem;font-weight:900;color:#FFD700;line-height:1;}
#timer-box{flex-shrink:0;background:#330000;border:2.5px solid #FF6688;border-radius:10px;padding:2px 10px;text-align:center;display:none;}
#timer-box.on{display:block;}
.tm-lbl{font-size:.36rem;color:#FF88AA;font-weight:900;text-transform:uppercase;}
.tm-val{font-size:1.5rem;font-weight:900;color:#fff;line-height:1;}
.tm-val.urgent{color:#FF3366;animation:pulse .5s infinite alternate;}
@keyframes pulse{from{opacity:1;}to{opacity:.3;}}
#streak-box{flex-shrink:0;background:#111;border:2.5px solid #FF8800;border-radius:10px;padding:2px 8px;text-align:center;display:none;}
#streak-box.on{display:block;}
.streak-val{font-size:.95rem;font-weight:900;color:#FFD700;}
.top-btn{width:34px;height:34px;flex-shrink:0;background:#111;border-radius:50%;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:.95rem;cursor:pointer;}
#middle{flex:1;display:flex;overflow:hidden;min-height:0;width:100%;}
#lp,#rp{width:155px;flex-shrink:0;display:flex;flex-direction:column;gap:5px;padding:6px 5px;background:#000;overflow-y:auto;}
#lp{border-right:3px solid #FFD700;}
#rp{border-left:3px solid #FFD700;}
.card{background:#111;border:2px solid #FFD700;border-radius:12px;padding:6px;}
.card-lbl{font-size:.5rem;font-weight:900;color:#FFD700;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:4px;}
.lv-art{width:100%;height:78px;border-radius:8px;background:#222;border:2px solid #FFD700;margin-bottom:3px;overflow:hidden;}
.lv-art img{width:100%;height:100%;object-fit:cover;}
.lv-pill{background:#2255CC;color:#fff;font-size:.88rem;font-weight:900;border-radius:8px;padding:2px 12px;display:inline-block;border:2px solid #fff;margin-top:2px;}
.sc-val{font-size:1.45rem;font-weight:900;color:#fff;text-align:center;}
.st-row{display:flex;gap:3px;justify-content:center;margin-top:2px;}
.st-ic{font-size:1rem;opacity:.2;filter:grayscale(1);}
.st-ic.on{opacity:1;filter:none;}
.st-bar{height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:3px;}
.st-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);border-radius:4px;transition:width .4s;}
.goal-row{display:flex;align-items:center;gap:4px;background:#1a1a1a;border-radius:8px;padding:3px 4px;margin-bottom:3px;}
.goal-ico{width:34px;height:34px;border-radius:7px;overflow:hidden;border:2px solid #FFD700;flex-shrink:0;}
.goal-ico img{width:100%;height:100%;object-fit:cover;}
.goal-num{font-size:1.05rem;font-weight:900;color:#FFD700;}
.goal-num.done{color:#00FF88;}
.goal-name{font-size:.46rem;font-weight:900;color:#ddd;}
.lives-row{display:flex;justify-content:center;gap:2px;}
.life-ic{font-size:1rem;}
.life-ic.lost{opacity:.2;filter:grayscale(1);}
.bs-btn{display:flex;align-items:center;gap:4px;background:#1a1a1a;border:2px solid #FFD700;border-radius:10px;padding:4px;cursor:pointer;position:relative;margin-bottom:4px;}
.bs-btn.on{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.5);}
.bs-ico{width:34px;height:34px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.bs-ico.h{background:#CC0000;}.bs-ico.s{background:#CC8800;}.bs-ico.g{background:#0055CC;}
.bs-name{font-size:.54rem;color:#FFE566;font-weight:900;flex:1;}
.bs-cnt{font-size:.44rem;font-weight:900;color:#fff;background:#CC0044;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;position:absolute;top:-5px;right:-5px;}
.mode-badge{background:linear-gradient(135deg,#FF6600,#FFD700);border-radius:7px;padding:2px 7px;font-size:.5rem;font-weight:900;color:#111;text-align:center;margin-bottom:3px;}

/* BOARD */
#board-area{flex:1;display:flex;align-items:center;justify-content:center;padding:5px;min-width:0;min-height:0;background:#000;}
#frame-outer{padding:5px;border-radius:20px;background:linear-gradient(145deg,#FFE566,#FF8C00,#FFD700,#FF6600,#FFE566);box-shadow:0 0 0 3px #000,0 5px 28px rgba(255,165,0,.5);}
#frame-inner{border-radius:16px;padding:4px;background:#000;}
#board-wrap{border-radius:12px;padding:4px;background:#111;position:relative;overflow:hidden;}
#board{display:grid;position:relative;z-index:1;}
.tw{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.tb{position:absolute;inset:2px;border-radius:9px;background:#222;border:2px solid rgba(255,255,255,.05);box-shadow:inset 0 1px 3px rgba(255,255,255,.05),0 3px 0 rgba(0,0,0,.8);z-index:1;overflow:hidden;}
.ta{position:absolute;inset:0;border-radius:7px;background-size:cover;background-position:center;background-repeat:no-repeat;background-color:transparent;z-index:3;pointer-events:none;will-change:transform,opacity;overflow:hidden;}
.ts{position:absolute;top:2px;left:3px;right:3px;height:30%;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,0));border-radius:7px 7px 50% 50%;pointer-events:none;z-index:20;}
.pw-tile{position:absolute;inset:0;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;z-index:10;pointer-events:none;}
.pw-tile-ico{font-size:1.9em;line-height:1;}
.pw-tile-lbl{font-size:.26em;font-weight:900;color:#fff;letter-spacing:1px;}
.tw.pw-rocket .tb{background:radial-gradient(circle at 50% 35%,#FFAA00,#CC5500)!important;border-color:#FF8800!important;box-shadow:0 3px 0 rgba(0,0,0,.8),0 0 16px rgba(255,140,0,.8)!important;}
.tw.pw-bomb .tb{background:radial-gradient(circle at 50% 35%,#FF4466,#AA0022)!important;border-color:#FF0044!important;box-shadow:0 3px 0 rgba(0,0,0,.8),0 0 16px rgba(255,0,68,.8)!important;}
.tw.pw-rainbow .tb{background:radial-gradient(circle at 50% 35%,#CC44FF,#660099)!important;border-color:#FF88FF!important;box-shadow:0 3px 0 rgba(0,0,0,.8),0 0 16px rgba(200,100,255,.8)!important;}
.tw.bk{cursor:default;}
.bi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2em;z-index:4;}
.bk-ice .tb{background:linear-gradient(145deg,#E8F8FF,#87CEEB,#4499CC)!important;border:3px solid #66BBFF!important;box-shadow:inset 0 2px 8px rgba(255,255,255,.7),0 3px 0 rgba(0,0,0,.8)!important;}
.bk-ice .tb::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));border-radius:6px 6px 50% 50%;pointer-events:none;z-index:5;}
.bk-bone .tb{background:linear-gradient(145deg,#F5F0E0,#D4C9A8)!important;border:3px solid #D4C9A8!important;}
.bk-vine .tb{background:linear-gradient(145deg,#66CC44,#2d8a10)!important;border:3px solid #88DD44!important;}
.bk-wood .tb{background:linear-gradient(145deg,#CC8844,#8B5520)!important;border:3px solid #DDAA55!important;}
.bk-stone .tb{background:linear-gradient(145deg,#AAAAAA,#666)!important;border:3px solid #BBBBBB!important;}
.bk-locked .tb{background:linear-gradient(145deg,#664400,#332200)!important;border:3px solid #FF8800!important;}
.bk-bubble .tb{background:radial-gradient(circle at 35% 30%,rgba(150,220,255,.9),rgba(100,180,255,.6))!important;border:3px solid rgba(200,240,255,.8)!important;}
.bk-mystery .tb{background:linear-gradient(145deg,#8800AA,#440055)!important;border:3px solid #FF88FF!important;animation:mystPulse 1.5s infinite alternate;}
@keyframes mystPulse{from{box-shadow:0 3px 0 rgba(0,0,0,.8),0 0 8px rgba(200,0,255,.4);}to{box-shadow:0 3px 0 rgba(0,0,0,.8),0 0 22px rgba(200,0,255,.9);}}
.bk-mystery .bi{animation:mystSpin 3s linear infinite;}
@keyframes mystSpin{to{transform:rotate(360deg);}}
.bk-jelly .tb{background:radial-gradient(circle at 40% 35%,#FF88CC,#CC0066)!important;border:3px solid #FF44AA!important;}
.bk-jelly .bi{animation:jellyWobble .8s infinite alternate;}
@keyframes jellyWobble{from{transform:scale(1);}to{transform:scale(1.1) rotate(5deg);}}
.tw.sel .tb{border-color:#FFD700!important;box-shadow:0 0 0 2px rgba(255,215,0,.9),0 0 14px rgba(255,215,0,.8)!important;}
.tw.sel .ta{transform:translateY(-2px) scale(1.05);}
.tw.ht .ta{animation:htA .6s infinite alternate;}
@keyframes htA{from{filter:brightness(1);}to{filter:brightness(1.5) drop-shadow(0 0 8px rgba(255,240,50,.9));}}

/* ART GALLERY */
.puzzle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:4px;border:2px solid #FFD700;border-radius:6px;overflow:hidden;background:#FFD700;}
